<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Torre del Vilar</title>
    <style>
        body { font-family: sans-serif; background: #fdfaf6; padding: 20px; text-align: center; color: #4a5d4d; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .azul { border-left: 10px solid #007bff; } .rosa { border-left: 10px solid #ff69b4; }
        .verde { border-left: 10px solid #28a745; } .naranja { border-left: 10px solid #fd7e14; }
    </style>
</head>
<body>
    <h1>La Torre del Vilar</h1>
    <div class="card azul">🔵 <b>AZUL:</b> Pica, encimera y neveras.</div>
    <div class="card rosa">🔴 <b>ROSA:</b> Ducha y exterior WC.</div>
    <div class="card verde">🟢 <b>VERDE:</b> Microondas y campana.</div>
    <div class="card naranja">🟠 <b>NARANJA:</b> Polvo muebles.</div>
    <p>⚠️ <i>Usa siempre papel para cristales y pantallas.</i></p>
</body>
</html>
